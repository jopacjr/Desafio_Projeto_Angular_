<div class="login-page">
  <!-- Lado Esquerdo: Imagem da Ranger -->
  <div class="login-left">
    <img src="img/ranger.png" alt="Ford Ranger" class="car-image">
  </div>

  <!-- Lado Direito: Formulário de Login -->
  <div class="login-right">
    <div class="login-container">
      <!-- Logo da Ford -->
      <div class="logo-container">
        <img src="img/ford.png" alt="Ford" class="ford-logo">
      </div>

      <h2 class="title">Boas-vindas</h2>

      <form (ngSubmit)="onSubmit()">
        <!-- Campo Usuário -->
        <div class="form-group">
          <label for="username">Usuário</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="Digite seu usuário" 
            [value]="username" 
            (input)="username = $any($event.target).value" 
            name="username" 
            required>
        </div>

        <!-- Campo Senha -->
        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Digite sua senha" 
            [value]="password" 
            (input)="password = $any($event.target).value" 
            name="password" 
            required>
        </div>

        <!-- Checkbox Logar automaticamente -->
        <div class="checkbox-group">
          <input 
            type="checkbox" 
            id="autoLogin" 
            [checked]="autoLogin" 
            (change)="autoLogin = $any($event.target).checked" 
            name="autoLogin">
          <label for="autoLogin">Logar automaticamente</label>
        </div>

        <!-- Botão Entrar -->
        <button type="submit" class="btn-submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
